<!doctype html>
<html lang="fr-TN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%VITE_APP_PRIMARY_COLOR%" />
    <script>
      const applyInitialTheme = (dark) => {
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1220');
      };
      try {
        const theme = localStorage.getItem('phone-clinic-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyInitialTheme(theme === 'dark' || (theme !== 'light' && prefersDark));
      } catch {
        applyInitialTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
    </script>
    <meta name="app-build-id" content="%VITE_BUILD_ID%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT_NAME%" />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_NAME%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_APP_LOGO%" />
    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="%VITE_APP_NAME%" />
    <meta property="twitter:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="twitter:image" content="%VITE_APP_LOGO%" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body style="--brand-primary: %VITE_APP_PRIMARY_COLOR%">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
